name: CI 

on:
    push:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Check out my code
              uses: actions/checkout@v4

            - name: Set up node
              uses: actions/setup-node@v4
              with:
                 node-version: '20'

            - name: Cache npm packages
              uses: actions/cache@v4
              with:
                path: ~/.npm
                key: ${{ runner.os }}-npm-${{ hashFiles('app/package-lock.json') }}     

            - name: npm-install
              run: npm install
              working-directory: app
              
            - name: npm-test
              run: npm test
              working-directory: app  

            - name: say hello
              run: echo "Hello from GitHub Actions"  

            - name: Show files on the machine
              run: ls -la     

    lint:      
        runs-on: ubuntu-latest
        needs: test
        steps:
          - name: Check out My code
            uses: actions/checkout@v4

          - name: Check index.js syntax
            run: node --check app/index.js

